# Edge reverse proxy: one origin for both the API and the SPA, so the
# browser never has to deal with cross-origin requests at all (avoids
# depending on CORS config being right, though app/main.py still sets it
# correctly as a defense-in-depth measure).
#
# This same config works whether TLS is terminated here (classic
# port-forward + Let's Encrypt path) or upstream at Cloudflare's edge with
# plain HTTP arriving from a cloudflared tunnel - see
# docs/public-exposure-guide.md for both paths.

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
