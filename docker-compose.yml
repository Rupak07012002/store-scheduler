# Base config: safe defaults for BOTH local dev and real hosting - nothing
# here binds a port directly to the host except the optional nginx proxy.
# Local dev gets its convenience port mappings (5173, 8000, 5432) and
# live-reload volumes from docker-compose.override.yml, which Compose loads
# automatically ONLY when you run `docker compose up` with no explicit -f
# flags. Production (docker-compose.prod.yml) is applied with explicit -f
# flags, which skips docker-compose.override.yml entirely - see
# docs/public-exposure-guide.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://scheduler:change_me_locally@postgres:5432/scheduler}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_to_a_long_random_string}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Chicago}
      DEFAULT_FOOTFALL_TO_STAFF_RATIO: ${DEFAULT_FOOTFALL_TO_STAFF_RATIO:-25.0}
      DEFAULT_MIN_STAFF_FLOOR: ${DEFAULT_MIN_STAFF_FLOOR:-1}
      DEFAULT_AVG_TRANSACTION_VALUE: ${DEFAULT_AVG_TRANSACTION_VALUE:-35.0}
      DEFAULT_MAX_HOURS_BEFORE_OVERTIME: ${DEFAULT_MAX_HOURS_BEFORE_OVERTIME:-40.0}
      DEFAULT_OVERTIME_MULTIPLIER: ${DEFAULT_OVERTIME_MULTIPLIER:-1.5}
      DEFAULT_MIN_REST_HOURS_BETWEEN_SHIFTS: ${DEFAULT_MIN_REST_HOURS_BETWEEN_SHIFTS:-10.0}
      DEFAULT_REQUIRED_BREAK_MINUTES: ${DEFAULT_REQUIRED_BREAK_MINUTES:-30}
      DEFAULT_MAX_CONSECUTIVE_DAYS: ${DEFAULT_MAX_CONSECUTIVE_DAYS:-6}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

  frontend:
    build: ./frontend
    image: store-scheduler-frontend:dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}

  # Optional reverse proxy - the only service that binds ports to the host
  # in the base config. Off by default; enable with `--profile proxy`.
  # In production this is how the app is actually reached - see
  # docs/public-exposure-guide.md.
  nginx:
    image: nginx:alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
